name: Python build one single wheel

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: true
        type: string
      TESTPYPI_VERSION:
        required: true
        type: string
      platform:
        required: false
        type: string
        default: auto

jobs:

  build:
    #name: py${{ inputs.python-version }}-${{ inputs.os }}-${{ inputs.arch }}
    runs-on: ${{ inputs.os }}

    steps:
    - name: Show the context for this job
      env:
        EVENT_CONTEXT: ${{ toJSON(github.event) }}
      run: |
        echo $EVENT_CONTEXT

    - uses: actions/checkout@v7

      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
          github.sha }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13.x

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests packaging ninja

    - name: Figure out the TestPyPi/PyPi Version
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$ALPHA_BRIDGE_SOURCE_REF" == *"refs/tags"* ]]; then
          # Gate (CoolProp-1tbe.3): the published REAL-PyPI version is derived
          # from CMakeLists.txt, NOT the tag name. Assert the tag matches the
          # CMakeLists version and is not a .dev release before publishing
          # (else e.g. a v8.0.0b1 tag on an unbumped 7.2.1dev tree would publish
          # 7.2.1.dev0). --current pins the published version to CMakeLists (no
          # auto-increment), so tag == CMakeLists == published.
          python dev/ci/check_tag_version.py "$ALPHA_BRIDGE_SOURCE_REF"
          COOLPROP_VERSION_OVERRIDE=$(python dev/extract_version.py --pypi --current)
        else
          COOLPROP_VERSION_OVERRIDE=$(python dev/extract_version.py --version "${{ inputs.TESTPYPI_VERSION }}")
        fi
        # Fail loudly rather than fall back to the static CMakeLists version: an
        # empty override would silently re-publish 7.2.1.dev0 and get skipped by
        # twine --skip-existing, which is exactly the #2988 failure mode.
        if [[ -z "$COOLPROP_VERSION_OVERRIDE" ]]; then
          echo "::error::extract_version.py returned an empty version"
          exit 1
        fi
        echo "Resolved package version: $COOLPROP_VERSION_OVERRIDE"
        # The build resolves the version via dev/coolprop_version_provider.py,
        # which reads this env var (see pyproject.toml).
        echo "COOLPROP_VERSION_OVERRIDE=$COOLPROP_VERSION_OVERRIDE" >> "$GITHUB_ENV"

      env:
        ALPHA_BRIDGE_SOURCE_SHA: ${{ (github.event_name == 'schedule' || 
          github.event_name == 'workflow_run') && 
          '022b63e4f73ce25757e1d696a81ffeeba230c261' || github.sha }}
        ALPHA_BRIDGE_SOURCE_REF: ${{ (github.event_name == 'schedule' || 
          github.event_name == 'workflow_run') && 'refs/heads/master' || 
          github.ref }}
        ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ (github.event_name == 'schedule' || 
          github.event_name == 'workflow_run') && 'master' || github.ref_name }}
    - name: Cache CPM packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/CPM
        key: cpm-${{ runner.os }}-${{ inputs.arch }}-${{ 
          hashFiles('cmake/dependencies.cmake') }}
        restore-keys: |
          cpm-${{ runner.os }}-${{ inputs.arch }}-
          cpm-${{ runner.os }}-

    # cibuildwheel 4.0 makes delvewheel the default Windows repair command, but
    # the cross-compiled win_arm64 wheels (py3.9/3.10 on the x64 windows-latest
    # host) can't be repaired there — delvewheel can't find the ARM64
    # msvcp140.dll and aborts.  Disable repair on that cross leg ONLY, matching
    # pre-4.0 behavior; native ARM64 (windows-11-arm) and AMD64/x86 keep the
    # default delvewheel repair.  Setting the var empty = "skip repair";
    # leaving it unset = cibuildwheel default.  (CoolProp-6z0a)
    - name: Disable delvewheel repair on cross-compiled Windows ARM64
      if: ${{ inputs.os == 'windows-latest' && inputs.arch == 'ARM64' }}
      shell: bash
      run: |-
        echo "CIBW_REPAIR_WHEEL_COMMAND_WINDOWS=" >> "$GITHUB_ENV"


    - name: Build and test wheels
      uses: pypa/cibuildwheel@v4.2.1
      env:
        # Make pip tolerant of transient DNS / connection failures on the
        # post-build wheel test (most often hits macOS runners pulling
        # numpy from files.pythonhosted.org). Default pip retries=5 with a
        # short timeout is too aggressive about giving up.
        PIP_RETRIES: 10
        PIP_TIMEOUT: 60
        PIP_DEFAULT_TIMEOUT: 60
        MACOSX_DEPLOYMENT_TARGET: 11.0
        # COOLPROP_NANOBIND=ON is the v8 go-live signal (bd CoolProp-r9sq.6): it
        # drives both the nanobind CMake build and (on Py>=3.12) the abi3 wheel tag
        # via the scikit-build-core overrides in pyproject.toml.  Set on every
        # platform so the published wheel is the nanobind core + State shim.
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0 
          SDKROOT=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
          CPM_SOURCE_CACHE=$HOME/.cache/CPM PIP_RETRIES=10 PIP_TIMEOUT=60 
          PIP_DEFAULT_TIMEOUT=60 COOLPROP_NANOBIND=ON
        CIBW_BEFORE_BUILD_LINUX: >
          pip install ninja &&
          git config --global --add safe.directory "*"
        # PIP_ONLY_BINARY=numpy: numpy stopped shipping manylinux2014 (glibc 2.17)
        # wheels after 2.2.6, so the test-install inside the manylinux2014
        # container was compiling numpy from its sdist; numpy 2.5's meson build
        # hard-requires GCC >= 10.3 and the container has devtoolset-10 (10.2.1),
        # which broke the cp312 Linux jobs.  Forcing binary-only makes pip
        # backtrack to the newest numpy WITH a manylinux2014 wheel (2.2.6 for
        # cp312; wheels exist for cp39-cp313 on x86_64 and aarch64).  numpy is a
        # runtime dep only, not a build requirement, so this cannot affect the
        # wheel build itself.  NOTE: a future cp314 Linux job has NO
        # manylinux2014 numpy wheel at all -- migrating the images to
        # manylinux_2_28 is the real fix (bd CoolProp-rcrj).
        CIBW_ENVIRONMENT_LINUX: COOLPROP_CMAKE=default,NATIVE 
          CPM_SOURCE_CACHE=/root/.cache/CPM PIP_RETRIES=10 PIP_TIMEOUT=60 
          PIP_DEFAULT_TIMEOUT=60 COOLPROP_NANOBIND=ON PIP_ONLY_BINARY=numpy
        CIBW_ENVIRONMENT_WINDOWS: COOLPROP_NANOBIND=ON PIP_RETRIES=10 
          PIP_TIMEOUT=60 PIP_DEFAULT_TIMEOUT=60
        # Platform and archs for Pyodide target
        CIBW_PLATFORM: ${{ inputs.platform }}
        CIBW_ARCHS_PYODIDE: ${{ inputs.arch }}
        # Linux wheels build inside the manylinux container, which does not
        # inherit host env vars; forward the resolved version through so the
        # version provider sees it. macOS/Windows build on the host directly.
        CIBW_ENVIRONMENT_PASS_LINUX: COOLPROP_VERSION_OVERRIDE
        CIBW_BUILD: cp${{ inputs.python-version }}-*
        CIBW_ARCHS_MACOS: ${{ inputs.arch }} # x86_64 arm64 # universal2 is redundant
        CIBW_ARCHS_WINDOWS: ${{ inputs.arch }} # AMD64 x86 ARM64 (ARM64: native on windows-11-arm for py>=3.11, else cross-compiled — see CoolProp-6z0a)
        CIBW_ARCHS_LINUX: ${{ inputs.arch }} # i686 x86_64 aarch64 ppc64le s390x
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
        CIBW_MANYLINUX_I686_IMAGE: manylinux2014
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
        # CIBW_SKIP: "pp*"
        CIBW_TEST_SKIP: "*-macosx_arm64 *-win_arm64"
      with:
        package-dir: .
        output-dir: Python

    - name: Upload Files
      uses: actions/upload-artifact@v7
      with:
        name: Python-${{ inputs.os }}-${{ inputs.python-version }}-${{ 
          inputs.arch }}
        path: |
          ./Python/*.whl
    needs:
    - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-65ba5f8a56ac18ac-${{ github.workflow }}-${{ 
        github.sha }}-${{ github.event.schedule || github.event_name }}
      cancel-in-progress: false
      queue: max
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name 
          == 'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
          github.sha }}
        AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && 'refs/heads/master' || github.ref }}
        AB_WORKFLOW_DIGEST: 
          8b565d6867c00adc105c41e0f84b17e7315ad080e8b8e3c0cc1fb7ba6081d503
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
        AB_DEFAULT_PERMISSIONS: write
        AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
        re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
        CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES =
        (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
        \    \"\"\"GitHub prefixes callable job names with each caller's display name.\"\
        \"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in INPUT_CHECK_NAMES\n\
        \n\ndef input_identity(job):\n    for step in job.get(\"steps\", []):\n  \
        \      if step.get(\"conclusion\") != \"success\":\n            continue\n\
        \        name = step.get(\"name\", \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n\
        \            if name.startswith(prefix):\n                identity = name.removeprefix(prefix)\n\
        \                if re.fullmatch(r\"[0-9a-f]{64}\", identity):\n         \
        \           return identity\n    return \"\"\n\n\ndef parent_has_work(get,
        repository, parent):\n    if (\n        not parent\n        or parent.get(\"\
        head_branch\") != \"alpha-bridge-ci\"\n        or parent.get(\"status\") !=
        \"completed\"\n    ):\n        return True\n    sha = parent[\"head_sha\"\
        ]\n    if re.fullmatch(r\"[0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"\
        parent workflow has no exact configuration commit\")\n    record = get(f\"\
        /repos/{repository}\")\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
        )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n \
        \   if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
        schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
        ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
        ValueError(\"parent CI configuration has no verified fork ownership\")\n \
        \   path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
        .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
        ):\n        raise ValueError(\"parent workflow path is outside its configuration
        owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
        safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
        content\"])).hexdigest() != marker.get(\n        \"definition_sha256\", {}\n\
        \    ).get(path):\n        raise ValueError(\"parent workflow differs from
        its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
        :\n        return False\n    jobs = []\n    page = 1\n    while True:\n  \
        \      values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
        \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
        < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
        \        for job in jobs\n        if is_input_check(job) and job.get(\"conclusion\"\
        ) == \"success\" and input_identity(job)\n    ]\n    return not guards or
        any(\n        job not in guards and job.get(\"conclusion\") != \"skipped\"\
        \ for job in jobs\n    )\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    page = 1\n    while True:\n       \
        \ # Filter locally: GitHub caps filtered searches at 1,000 results.\n    \
        \    query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
        \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
        ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
        ) != current[\"head_branch\"] or run.get(\"event\") != event:\n          \
        \      continue\n            job_page = 1\n            while True:\n     \
        \           jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
        \n                )[\"jobs\"]\n                for job in jobs:\n        \
        \            if (\n                        (\n                           \
        \ is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
        \                            else job[\"name\"] == job_name\n            \
        \            )\n                        and job.get(\"status\") == \"completed\"\
        \n                        and job.get(\"conclusion\") == \"success\"\n   \
        \                     and input_identity(job) == identity\n              \
        \      ):\n                        return False\n                if len(jobs)
        < 100:\n                    break\n                job_page += 1\n       \
        \ if len(runs[\"workflow_runs\"]) < 100:\n            return True\n      \
        \  page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"]\n    event_payload
        = None\n    if event not in {\"schedule\", \"workflow_run\"}:\n        with
        open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\") as payload_file:\n\
        \            event_payload = json.load(payload_file)\n    inputs = {\n   \
        \     \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n        \"source_ref\"\
        : os.environ[\"AB_REF\"],\n        \"workflow_definition\": os.environ[\"\
        AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n        \"event_payload\"\
        : event_payload,\n        \"schedule\": os.environ[\"AB_SCHEDULE\"],\n   \
        \     \"variables\": json.loads(os.environ[\"AB_VARIABLES\"]),\n        \"\
        inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"default_workflow_permissions\"\
        : os.environ[\"AB_DEFAULT_PERMISSIONS\"],\n        \"runner_image\": [os.environ.get(\"\
        ImageOS\", \"\"), os.environ.get(\"ImageVersion\", \"\")],\n        \"producer\"\
        : json.loads(os.environ.get(\"AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity
        = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    manual = event == \"workflow_dispatch\"\
        \ or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n    should_run = manual
        or (\n        (\n            inputs[\"event\"] != \"workflow_run\"\n     \
        \       or parent_has_work(get, os.environ[\"AB_REPOSITORY\"], inputs[\"producer\"\
        ])\n        )\n        and changed(\n            get,\n            repository=os.environ[\"\
        AB_REPOSITORY\"],\n            run_id=int(os.environ[\"AB_RUN_ID\"]),\n  \
        \          identity=identity,\n            job_name=\"CI input check\",\n\
        \        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"\
        utf-8\") as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\n        \"Explicit CI run requested\"\n        if manual\n\
        \        else \"CI inputs changed\"\n        if should_run\n        else \"\
        CI inputs unchanged; build and test jobs skipped\"\n    )\n\n\nif __name__
        == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
    - name: CI input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
