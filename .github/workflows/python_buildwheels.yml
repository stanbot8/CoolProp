name: Python cibuildwheel

# Wheel-matrix gating (CoolProp-rog):
#   • On master/develop pushes, tags, and PRs carrying the `full-wheels`
#     label, build the full matrix (6 Pythons × ~7 arches ≈ 42 wheels).
#   • On every other PR, build a representative subset (1 Linux x86_64,
#     1 Linux aarch64, 1 Windows AMD64, 1 macOS arm64 — newest Python
#     only). Cuts ~90% of PR wheel CI minutes while still catching
#     cross-platform breakage pre-merge.
# Adding the `full-wheels` label to an open PR triggers a fresh full
# build (via the `labeled` event type); other label changes are ignored
# by the gate in `set-matrix`.

on:
  push:
    branches: ['master', 'main', 'develop', 'actions_pypi']
    tags: ['v*']
  pull_request:
    branches: ['master', 'main', 'develop']
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # Cancel superseded runs on the same ref to cut CI backlog on heavy
  # dev days (repeated pushes to an open PR).  Protected: master / main
  # / develop and tags never cancel, so mainline + release runs always
  # complete.
  group: ${{ github.workflow }}-${{ ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' || 
    github.run_attempt > 1) && (((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/master' && ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/main' && ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/develop' && !startsWith(((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref), 
    'refs/tags/')) }}

jobs:
  set-version:
    # Skip this whole workflow on label events unless the label is `full-wheels`,
    # otherwise every unrelated label change would spawn a wheel build.
    if: |-
      ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'full-wheels') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      testpypiversion: ${{ steps.set.outputs.testpypiversion }}
    steps:
      - name: Set version for testpypi
        id: set
        run: |-
          echo "testpypiversion=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT


    needs:
      - alpha_bridge_inputs
  set-matrix:
    needs:
      - set-version
      - alpha_bridge_inputs
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.detect.outputs.full }}
      py_versions: ${{ steps.detect.outputs.py_versions }}
      ubuntu_archs: ${{ steps.detect.outputs.ubuntu_archs }}
      ubuntu_arm_archs: ${{ steps.detect.outputs.ubuntu_arm_archs }}
      windows_archs: ${{ steps.detect.outputs.windows_archs }}
      macos_archs: ${{ steps.detect.outputs.macos_archs }}
    steps:
      - name: Decide full vs subset matrix
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          full=false
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full=true
          elif [[ "$EVENT_NAME" == "pull_request" ]] && echo "$LABELS_JSON" | grep -q '"full-wheels"'; then
            full=true
          fi
          echo "Mode: $(if $full; then echo full; else echo subset; fi)"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          # v8 go-live (bd CoolProp-r9sq.6): the wheels are now nanobind. The cp312
          # build is abi3-tagged (one cp312-abi3 wheel covers 3.12/3.13/3.14), so
          # 3.13/3.14 are dropped from the matrix to avoid building duplicate abi3
          # wheels; 3.9-3.11 stay per-version (below nanobind's stable-ABI floor).
          if $full; then
            echo 'py_versions=[39, 310, 311, 312]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu_archs=["x86_64"]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu_arm_archs=["aarch64"]' >> "$GITHUB_OUTPUT"
            echo 'windows_archs=["AMD64", "x86", "ARM64"]' >> "$GITHUB_OUTPUT"
            echo 'macos_archs=["x86_64", "arm64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'py_versions=[312]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu_archs=["x86_64"]' >> "$GITHUB_OUTPUT"
            echo 'ubuntu_arm_archs=["aarch64"]' >> "$GITHUB_OUTPUT"
            echo 'windows_archs=["AMD64"]' >> "$GITHUB_OUTPUT"
            echo 'macos_archs=["arm64"]' >> "$GITHUB_OUTPUT"
          fi

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  python_source:
    needs:
      - set-version
      - alpha_bridge_inputs
    name: Build source package
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
            github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.x

      - name: Install dependencies
        run: |-
          pip install setuptools wheel Cython requests jinja2 pyyaml packaging


      - name: Figure out the TestPyPi/PyPi Version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ALPHA_BRIDGE_SOURCE_REF" == *"refs/tags"* ]]; then
            # Gate (CoolProp-1tbe.3): the published REAL-PyPI version is derived
            # from CMakeLists.txt, NOT the tag name. Assert the tag matches the
            # CMakeLists version and is not a .dev release before publishing
            # (else e.g. a v8.0.0b1 tag on an unbumped 7.2.1dev tree would publish
            # 7.2.1.dev0). --current pins the published version to CMakeLists (no
            # auto-increment), so tag == CMakeLists == published.
            python dev/ci/check_tag_version.py "$ALPHA_BRIDGE_SOURCE_REF"
            COOLPROP_VERSION_OVERRIDE=$(python dev/extract_version.py --pypi --current)
          else
            COOLPROP_VERSION_OVERRIDE=$(python dev/extract_version.py --version "${{ needs.set-version.outputs.testpypiversion }}")
          fi
          # Fail loudly rather than fall back to the static CMakeLists version: an
          # empty override would silently re-publish 7.2.1.dev0 and get skipped by
          # twine --skip-existing, which is exactly the #2988 failure mode.
          if [[ -z "$COOLPROP_VERSION_OVERRIDE" ]]; then
            echo "::error::extract_version.py returned an empty version"
            exit 1
          fi
          echo "Resolved package version: $COOLPROP_VERSION_OVERRIDE"
          # The sdist build resolves the version via dev/coolprop_version_provider.py,
          # which reads this env var (see pyproject.toml).
          echo "COOLPROP_VERSION_OVERRIDE=$COOLPROP_VERSION_OVERRIDE" >> "$GITHUB_ENV"

        env:
          ALPHA_BRIDGE_SOURCE_SHA: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 
            '022b63e4f73ce25757e1d696a81ffeeba230c261' || github.sha }}
          ALPHA_BRIDGE_SOURCE_REF: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 'refs/heads/master' || 
            github.ref }}
          ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 'master' || github.ref_name 
            }}
      - name: Build package, sdist
        run: |
          pip install build
          python -m build --sdist --outdir ${GITHUB_WORKSPACE}/Python

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Python-sdist
          path: |
            ./Python/*.tar.gz

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  python_ubuntu:
    needs:
      - set-version
      - set-matrix
      - alpha_bridge_inputs
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ${{ fromJSON(needs.set-matrix.outputs.py_versions) }}
        arch: ${{ fromJSON(needs.set-matrix.outputs.ubuntu_archs) }}
    uses: ./.github/workflows/python_cibuildwheel.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      TESTPYPI_VERSION: ${{ needs.set-version.outputs.testpypiversion }}

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  python_ubuntu_arm:
    needs:
      - set-version
      - set-matrix
      - alpha_bridge_inputs
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
        python-version: ${{ fromJSON(needs.set-matrix.outputs.py_versions) }}
        arch: ${{ fromJSON(needs.set-matrix.outputs.ubuntu_arm_archs) }}
    uses: ./.github/workflows/python_cibuildwheel.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      TESTPYPI_VERSION: ${{ needs.set-version.outputs.testpypiversion }}

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  python_windows:
    needs:
      - set-version
      - set-matrix
      - alpha_bridge_inputs
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.set-matrix.outputs.py_versions) }}
        arch: ${{ fromJSON(needs.set-matrix.outputs.windows_archs) }}
    uses: ./.github/workflows/python_cibuildwheel.yml
    with:
      # Runner selection for Windows ARM64 (CoolProp-6z0a):
      #   • CPython ships a native win_arm64 interpreter only for 3.11+, so
      #     ARM64 on py>=3.11 builds NATIVELY on the windows-11-arm runner.
      #     Native build means delvewheel (cibuildwheel 4.0's default Windows
      #     repair) can resolve the ARM64 VC runtime, so the wheel repairs.
      #   • ARM64 on py3.9/3.10 has no native interpreter; it must cross-compile
      #     on the x64 windows-latest host, where delvewheel can't find the
      #     ARM64 msvcp140.dll — so repair is disabled on that leg (see the
      #     reusable workflow's CIBW_REPAIR_WHEEL_COMMAND_WINDOWS).
      #   • AMD64/x86 always run on windows-latest with the default repair.
      # python-version is encoded as 39/310/311/312 (monotonic with the real
      # version), so `>= 311` correctly means CPython >= 3.11.
      os: ${{ (matrix.arch == 'ARM64' && matrix.python-version >= 311) && 
        'windows-11-arm' || 'windows-latest' }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      TESTPYPI_VERSION: ${{ needs.set-version.outputs.testpypiversion }}

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  python_macos:
    needs:
      - set-version
      - set-matrix
      - alpha_bridge_inputs
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ${{ fromJSON(needs.set-matrix.outputs.py_versions) }}
        arch: ${{ fromJSON(needs.set-matrix.outputs.macos_archs) }}
    uses: ./.github/workflows/python_cibuildwheel.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      TESTPYPI_VERSION: ${{ needs.set-version.outputs.testpypiversion }}

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  python_pyodide:
    needs:
      - set-version
      - set-matrix
      - alpha_bridge_inputs
    strategy:
      fail-fast: false
      matrix:
        python-version: [313, 314]
        arch: [wasm32]
    uses: ./.github/workflows/python_cibuildwheel.yml
    with:
      os: ubuntu-latest
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      platform: pyodide
      TESTPYPI_VERSION: ${{ needs.set-version.outputs.testpypiversion }}

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  merge_wheels:
    runs-on: ubuntu-latest
    needs:
      - python_source
      - python_ubuntu
      - python_ubuntu_arm
      - python_windows
      - python_macos
      - python_pyodide
      - alpha_bridge_inputs
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: Python
          pattern: Python-*

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  upload_python_bindings_to_pypi:
    needs:
      - merge_wheels
      - alpha_bridge_inputs
    name: Upload to PyPi
    runs-on: ubuntu-latest
    steps:

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine requests packaging

          if [[ "$ALPHA_BRIDGE_SOURCE_REF" == *"refs/tags"* ]]; then
            TWINE_REPOSITORY=pypi
            TWINE_PASSWORD=${{ secrets.PYPI_TOKEN }}
          else
            TWINE_REPOSITORY=testpypi
            TWINE_PASSWORD=${{ secrets.TESTPYPI_TOKEN }}
          fi;
          echo "Using TWINE_REPOSITORY=$TWINE_REPOSITORY"
          echo "TWINE_REPOSITORY=$TWINE_REPOSITORY" >> $GITHUB_ENV
          echo "TWINE_PASSWORD=$TWINE_PASSWORD" >> $GITHUB_ENV

        env:
          ALPHA_BRIDGE_SOURCE_SHA: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 
            '022b63e4f73ce25757e1d696a81ffeeba230c261' || github.sha }}
          ALPHA_BRIDGE_SOURCE_REF: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 'refs/heads/master' || 
            github.ref }}
          ALPHA_BRIDGE_SOURCE_REF_NAME: ${{ (github.event_name == 'schedule' || 
            github.event_name == 'workflow_run') && 'master' || github.ref_name 
            }}
      - name: Download ALL wheels
        uses: actions/download-artifact@v8
        with:
          name: Python
          path: Python

      - name: Display structure of downloaded files
        run: |
          set -x
          ls -R
          du -sh

      - uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: |
            dev/ci/check_dist_notices.py
            THIRD_PARTY_NOTICES.md
          sparse-checkout-cone-mode: false

          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
            github.sha }}
      - name: Check every distribution ships THIRD_PARTY_NOTICES.md
        run: |-
          python src/dev/ci/check_dist_notices.py Python src/THIRD_PARTY_NOTICES.md


      - name: Publish wheels to (Test)PyPI
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TWINE_USERNAME: __token__
        run: |-
          python -m twine upload --verbose --skip-existing Python/*.whl Python/*.tar.gz
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
      - id: identity
        name: Check source, workflow, variables, and runner inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AB_REPOSITORY: ${{ github.repository }}
          AB_RUN_ID: ${{ github.run_id }}
          AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name
            == 'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
            github.sha }}
          AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'refs/heads/master' || github.ref }}
          AB_WORKFLOW_DIGEST: 
            c3b0af6705289e5a1603339e07d1726501eb77f9f143338a3133ba09d64bcbea
          AB_EVENT: ${{ github.event_name }}
          AB_SCHEDULE: ${{ github.event.schedule || '' }}
          AB_VARIABLES: ${{ toJSON(vars) }}
          AB_INPUTS: ${{ toJSON(inputs) }}
          AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        shell: bash
        run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
          embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
          annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
          re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
          CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES
          = (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
          \    \"\"\"GitHub prefixes callable job names with each caller's display
          name.\"\"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in
          INPUT_CHECK_NAMES\n\n\ndef input_identity(job):\n    for step in job.get(\"\
          steps\", []):\n        if step.get(\"conclusion\") != \"success\":\n   \
          \         continue\n        name = step.get(\"name\", \"\")\n        for
          prefix in INPUT_IDENTITY_PREFIXES:\n            if name.startswith(prefix):\n\
          \                identity = name.removeprefix(prefix)\n                if
          re.fullmatch(r\"[0-9a-f]{64}\", identity):\n                    return identity\n\
          \    return \"\"\n\n\ndef parent_has_work(get, repository, parent):\n  \
          \  if (\n        not parent\n        or parent.get(\"head_branch\") != \"\
          alpha-bridge-ci\"\n        or parent.get(\"status\") != \"completed\"\n\
          \    ):\n        return True\n    sha = parent[\"head_sha\"]\n    if re.fullmatch(r\"\
          [0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"parent workflow
          has no exact configuration commit\")\n    record = get(f\"/repos/{repository}\"\
          )\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
          )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n\
          \    if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
          schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
          ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
          ValueError(\"parent CI configuration has no verified fork ownership\")\n\
          \    path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
          .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
          ):\n        raise ValueError(\"parent workflow path is outside its configuration
          owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
          safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
          content\"])).hexdigest() != marker.get(\n        \"definition_sha256\",
          {}\n    ).get(path):\n        raise ValueError(\"parent workflow differs
          from its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
          :\n        return False\n    jobs = []\n    page = 1\n    while True:\n\
          \        values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
          \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
          < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
          \        for job in jobs\n        if is_input_check(job) and job.get(\"\
          conclusion\") == \"success\" and input_identity(job)\n    ]\n    return
          not guards or any(\n        job not in guards and job.get(\"conclusion\"\
          ) != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get, *, repository,
          run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
          )\n    event = current[\"event\"]\n    page = 1\n    while True:\n     \
          \   # Filter locally: GitHub caps filtered searches at 1,000 results.\n\
          \        query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
          \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
          )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
          ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
          ) != current[\"head_branch\"] or run.get(\"event\") != event:\n        \
          \        continue\n            job_page = 1\n            while True:\n \
          \               jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
          \n                )[\"jobs\"]\n                for job in jobs:\n      \
          \              if (\n                        (\n                       \
          \     is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
          \                            else job[\"name\"] == job_name\n          \
          \              )\n                        and job.get(\"status\") == \"\
          completed\"\n                        and job.get(\"conclusion\") == \"success\"\
          \n                        and input_identity(job) == identity\n        \
          \            ):\n                        return False\n                if
          len(jobs) < 100:\n                    break\n                job_page +=
          1\n        if len(runs[\"workflow_runs\"]) < 100:\n            return True\n\
          \        page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"\
          ]\n    event_payload = None\n    if event not in {\"schedule\", \"workflow_run\"\
          }:\n        with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
          ) as payload_file:\n            event_payload = json.load(payload_file)\n\
          \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
          \        \"source_ref\": os.environ[\"AB_REF\"],\n        \"workflow_definition\"\
          : os.environ[\"AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n     \
          \   \"event_payload\": event_payload,\n        \"schedule\": os.environ[\"\
          AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
          ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n      \
          \  \"runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"\
          ImageVersion\", \"\")],\n        \"producer\": json.loads(os.environ.get(\"\
          AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs,
          sort_keys=True).encode()).hexdigest()\n\n    def get(path):\n        request
          = urllib.request.Request(\n            \"https://api.github.com\" + path,\n\
          \            headers={\n                \"Authorization\": \"Bearer \" +
          os.environ[\"GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
          ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n         \
          \   },\n        )\n        with urllib.request.urlopen(request, timeout=60)
          as response:\n            return json.load(response)\n\n    manual = event
          == \"workflow_dispatch\" or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n\
          \    should_run = manual or (\n        (\n            inputs[\"event\"]
          != \"workflow_run\"\n            or parent_has_work(get, os.environ[\"AB_REPOSITORY\"\
          ], inputs[\"producer\"])\n        )\n        and changed(\n            get,\n\
          \            repository=os.environ[\"AB_REPOSITORY\"],\n            run_id=int(os.environ[\"\
          AB_RUN_ID\"]),\n            identity=identity,\n            job_name=\"\
          CI input check\",\n        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"\
          ], \"a\", encoding=\"utf-8\") as output:\n        output.write(f\"digest={identity}\\\
          nchanged={str(should_run).lower()}\\n\")\n    print(\n        \"Explicit
          CI run requested\"\n        if manual\n        else \"CI inputs changed\"\
          \n        if should_run\n        else \"CI inputs unchanged; build and test
          jobs skipped\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n\n\
          ALPHA_BRIDGE_CI_PY\n"
      - name: CI input identity ${{ steps.identity.outputs.digest }}
        run: echo 'Input identity recorded'
