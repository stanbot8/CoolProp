name: CMake library builds

permissions:
  contents: read

on:
  push:
    branches: ['master', 'main', 'develop', 'actions_shared']
    tags: ['v*']
  pull_request:
    branches: ['master', 'main', 'develop']

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

concurrency:
  # Cancel superseded runs on the same ref to cut CI backlog on heavy
  # dev days (repeated pushes to an open PR).  Protected: master / main
  # / develop and tags never cancel, so mainline + release runs always
  # complete.
  group: ${{ github.workflow }}-${{ ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' || 
    github.run_attempt > 1) && (((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/master' && ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/main' && ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/develop' && !startsWith(((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref), 
    'refs/tags/')) }}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: Default is true, switch to false to allow one platform to fail and still run others
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macOS-latest]
        linkage: [shared, static]
        include:
        - os: ubuntu-latest
          linkage: both
        - os: windows-latest
          linkage: both

    steps:
    - uses: actions/checkout@v7

      with:
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
          github.sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests packaging

    - name: Extract CoolProp version from CMakeLists.txt
      shell: bash
      run: |
        set -x
        COOLPROP_VERSION=$(python dev/extract_version.py --cmake-only)
        echo COOLPROP_VERSION=$COOLPROP_VERSION >> $GITHUB_ENV

    # Reuse the pinned CPM dependency sources across builds on each OS.
    - name: Cache CPM packages
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cpm_cache
        key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}
        restore-keys: |
          cpm-${{ runner.os }}-

    - name: Install system Eigen and fmt for package tests
      if: runner.os == 'Linux' && matrix.linkage == 'static'
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libfmt-dev

    - name: Configure CMake
      shell: bash
      run: |
        static=OFF
        shared=OFF
        case "${{ matrix.linkage }}" in
          static) static=ON ;;
          shared) shared=ON ;;
          both) static=ON; shared=ON ;;
        esac
        extra_args=()
        if [ "${{ runner.os }}" = Linux ] && [ "${{ matrix.linkage }}" = static ]; then
          extra_args+=("-DCPM_USE_LOCAL_PACKAGES=ON")
        fi
        if [ "${{ runner.os }}" = Windows ] && [ "${{ matrix.linkage }}" = both ]; then
          # Regression gate: Debug must still select the debug CRT even when
          # the deprecated compatibility switch is explicitly disabled.
          extra_args+=("-DCOOLPROP_MSVC_DEBUG:BOOL=OFF")
        fi
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} \
          -DCOOLPROP_STATIC_LIBRARY:BOOL="$static" \
          -DCOOLPROP_SHARED_LIBRARY:BOOL="$shared" \
          "${extra_args[@]}"

    - name: Build
      shell: bash
      # `nproc` is GNU coreutils: absent on macOS (and not a command in
      # Windows pwsh), so `$(nproc)` silently expands empty here, leaving a
      # bare `-j` — which goes *serial* on the macOS Unix Makefiles leg
      # (30+ min vs ~4 min on Linux). Resolve the core count portably and
      # under bash on all three runners. Mirrors csharp_builder.yml.
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        if [ "${{ runner.os }}" = Windows ] && [ "${{ matrix.linkage }}" = both ]; then
          # Each MSVC project already uses /MP. Building both projects in
          # parallel can exhaust the compiler heap on hosted runners.
          JOBS=1
        fi
        echo "Building with -j$JOBS"
        cmake --build build --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    - name: JSON symbol-leak gate (libCoolProp, Linux/macOS)
      # Fail if nlohmann/valijson/rapidjson symbols leak into libCoolProp's
      # dynamic export table. Rides the shared build produced above (ELF on
      # ubuntu, Mach-O on macOS) — no separate build. nm-based, so the Windows
      # PE legs are skipped (exports are opt-in via src/CoolPropLib.def).
      if: matrix.linkage != 'static' && (runner.os == 'Linux' || runner.os == 
        'macOS')
      shell: bash
      run: |
        set -euo pipefail
        # Match the SONAME-versioned real file too: install gives libCoolProp.so
        # as a symlink to libCoolProp.so.<ver> (the regular file), and -type f
        # excludes the symlink — so name the versioned forms explicitly.
        lib=$(find build install_root -type f \( -name 'libCoolProp.so' -o -name 'libCoolProp.so.*' -o -name 'libCoolProp.dylib' -o -name 'libCoolProp.*.dylib' \) | head -1)
        if [ -z "$lib" ]; then
          echo "FAIL: libCoolProp shared object not found under build/ or install_root/" >&2
          exit 1
        fi
        echo "Gating $lib"
        ./dev/ci/check-json-symbols.sh "$lib"

    - name: Test installed CMake package
      shell: bash
      run: |
        set -euo pipefail
        prefix_a="$RUNNER_TEMP/coolprop-prefix-a-${{ matrix.linkage }}"
        prefix_b="$RUNNER_TEMP/coolprop-prefix-b-${{ matrix.linkage }}"
        cmake -E remove_directory "$prefix_a"
        cmake -E remove_directory "$prefix_b"
        cmake --install build --config "${{ env.BUILD_TYPE }}" --prefix "$prefix_a"
        cmake -E rename "$prefix_a" "$prefix_b"

        python - "$prefix_b" "$GITHUB_WORKSPACE" "$prefix_a" <<'PY'
        from pathlib import Path
        import sys

        package_dir = Path(sys.argv[1]) / "lib" / "cmake" / "CoolProp"
        license_dir = Path(sys.argv[1]) / "share" / "licenses" / "CoolProp"
        required_files = {
            package_dir / "CoolPropConfig.cmake",
            package_dir / "CoolPropTargets.cmake",
            license_dir / "Eigen" / "COPYING.README",
            license_dir / "Eigen" / "COPYING.MPL2",
            # The shipped Eigen tree also contains Apache-2.0 (BFloat16.h) and
            # BSD (e.g. the *_LAPACKE.h, *_BLAS.h and MKL headers) files.
            license_dir / "Eigen" / "COPYING.APACHE",
            license_dir / "Eigen" / "COPYING.BSD",
            license_dir / "fmt" / "LICENSE",
        }
        missing = sorted(path for path in required_files if not path.is_file())
        if missing:
            raise SystemExit(f"Required installed files are missing: {missing}")

        cmake_files = list(package_dir.glob("*.cmake"))
        if not cmake_files:
            raise SystemExit(f"No CMake package files found under {package_dir}")

        forbidden = {
            value.replace("\\", "/")
            for value in (sys.argv[2], sys.argv[3])
        }
        for cmake_file in cmake_files:
            content = cmake_file.read_text(encoding="utf-8").replace("\\", "/")
            leaked = [value for value in forbidden if value and value in content]
            if leaked:
                raise SystemExit(f"{cmake_file} contains non-relocatable paths: {leaked}")
        PY

        if [ "${{ runner.os }}" = Linux ] && [ "${{ matrix.linkage }}" != static ]; then
          cmake_version="${COOLPROP_VERSION/-/}"
          test -f "$prefix_b/lib/libCoolProp.so.$cmake_version"
        fi

        expected=""
        expected_default=""
        disable_threads=FALSE
        case "${{ matrix.linkage }}" in
          static) expected=STATIC ;;
          shared)
            expected=SHARED
            # A shared-only imported target has no Threads link interface.
            # Prove that its config does not impose that static-only consumer
            # dependency.
            disable_threads=TRUE
            ;;
          # A dual build exports CoolProp::CoolProp as the variant named by
          # COOLPROP_DEFAULT_LIBRARY, SHARED by default.  Assert that selection
          # without narrowing the components: Static and Shared are both
          # still linked and run.
          both) expected_default=SHARED ;;
        esac
        cmake -S dev/ci/cmake-consumer -B consumer-build \
          -DCMAKE_PREFIX_PATH="$prefix_b" \
          -DCOOLPROP_EXPECTED_LINKAGE="$expected" \
          -DCOOLPROP_EXPECTED_DEFAULT_LINKAGE="$expected_default" \
          -DCMAKE_DISABLE_FIND_PACKAGE_Threads:BOOL="$disable_threads"
        cmake --build consumer-build --config "${{ env.BUILD_TYPE }}"
        ctest --test-dir consumer-build -C "${{ env.BUILD_TYPE }}" --output-on-failure

        if [ "${{ matrix.linkage }}" != static ]; then
          cmake -S dev/ci/cmake-consumer -B c-consumer-build \
            -DCMAKE_PREFIX_PATH="$prefix_b" \
            -DCOOLPROP_EXPECTED_LINKAGE=SHARED \
            -DCOOLPROP_C_ONLY=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Threads:BOOL="$disable_threads"
          cmake --build c-consumer-build --config "${{ env.BUILD_TYPE }}"
          ctest --test-dir c-consumer-build -C "${{ env.BUILD_TYPE }}" --output-on-failure
        fi

    - name: Reject an empty legacy install prefix
      if: runner.os == 'Linux' && matrix.linkage == 'static'
      shell: bash
      run: |
        set -euo pipefail
        if cmake -S . -B empty-prefix -DCOOLPROP_INSTALL_PREFIX:PATH= >empty-prefix.log 2>&1; then
          echo "FAIL: an empty COOLPROP_INSTALL_PREFIX was accepted"
          exit 1
        fi
        grep -F "COOLPROP_INSTALL_PREFIX must not be empty" empty-prefix.log
        # The failed configure must leave the install_root default cached, so
        # the suggested recovery (-U COOLPROP_INSTALL_PREFIX) does not fall
        # back to the platform default prefix.
        grep -E '^CMAKE_INSTALL_PREFIX:PATH=.*/install_root$' empty-prefix/CMakeCache.txt
        if cmake -S . -B empty-cmake-prefix -DCMAKE_INSTALL_PREFIX:PATH= >empty-cmake-prefix.log 2>&1; then
          echo "FAIL: an empty CMAKE_INSTALL_PREFIX was accepted"
          exit 1
        fi
        grep -F "CMAKE_INSTALL_PREFIX must not be empty" empty-cmake-prefix.log

    - name: Honor explicit dependency source directories
      if: runner.os == 'Linux' && matrix.linkage == 'static'
      shell: bash
      run: |
        set -euo pipefail
        eigen_source=$(sed -n 's/^CPM_PACKAGE_Eigen_SOURCE_DIR:INTERNAL=//p' build/CMakeCache.txt)
        fmt_source=$(sed -n 's/^CPM_PACKAGE_fmt_SOURCE_DIR:INTERNAL=//p' build/CMakeCache.txt)
        test -f "$eigen_source/Eigen/Core"
        test -f "$fmt_source/include/fmt/format.h"
        # Override with copies OUTSIDE the CPM cache.  Pointing the overrides
        # at the cache directories themselves cannot fail: CPM would resolve
        # the same paths even if the overrides were ignored.
        eigen_override="$RUNNER_TEMP/override-eigen"
        fmt_override="$RUNNER_TEMP/override-fmt"
        rm -rf "$eigen_override" "$fmt_override"
        cp -R "$eigen_source" "$eigen_override"
        cp -R "$fmt_source" "$fmt_override"
        cmake -S . -B source-overrides \
          -DCOOLPROP_STATIC_LIBRARY=ON \
          -DCPM_USE_LOCAL_PACKAGES=ON \
          -DCPM_Eigen_SOURCE="$eigen_override" \
          -DCPM_fmt_SOURCE="$fmt_override" \
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
        # The resolved include path must be the override, and the cached copy
        # must not appear at all.
        sed -n 's/^COOLPROP_INCLUDE_DIRECTORIES:[^=]*=//p' source-overrides/CMakeCache.txt \
          | tr ';' '\n' >source-overrides/include-dirs.txt
        grep -Fx "$eigen_override" source-overrides/include-dirs.txt
        grep -Fx "$fmt_override/include" source-overrides/include-dirs.txt
        if grep -Fx -e "$eigen_source" -e "$fmt_source/include" source-overrides/include-dirs.txt; then
          echo "FAIL: the CPM cache copy of Eigen or fmt was used despite the override"
          exit 1
        fi

    - name: Test system Eigen and fmt without vendored headers
      if: runner.os == 'Linux' && matrix.linkage == 'static'
      shell: bash
      run: |
        set -euo pipefail
        prefix_a="$RUNNER_TEMP/coolprop-system-a"
        prefix_b="$RUNNER_TEMP/coolprop-system-b"
        cmake -S . -B system-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCOOLPROP_STATIC_LIBRARY=ON \
          -DCOOLPROP_VENDOR_THIRD_PARTY=OFF \
          -DCPM_USE_LOCAL_PACKAGES=ON \
          -DCOOLPROP_INSTALL_LEGACY_LAYOUT=OFF \
          -DCMAKE_INSTALL_PREFIX="$prefix_a"
        cmake --build system-build --parallel 2
        cmake --install system-build
        cmake -E rename "$prefix_a" "$prefix_b"
        test ! -d "$prefix_b/include/CoolProp/third_party"
        if grep -R -E 'CoolProp/third_party|Eigen_SOURCE_DIR|fmt_SOURCE_DIR' "$prefix_b/lib/cmake/CoolProp"; then
          echo "FAIL: the system package still references vendored source/header paths"
          exit 1
        fi
        cmake -S dev/ci/cmake-consumer -B system-consumer \
          -DCMAKE_PREFIX_PATH="$prefix_b" \
          -DCOOLPROP_EXPECTED_LINKAGE=STATIC
        cmake --build system-consumer --parallel 2
        ctest --test-dir system-consumer --output-on-failure
        if cmake -S dev/ci/cmake-consumer -B missing-eigen-consumer \
            -DCMAKE_PREFIX_PATH="$prefix_b" \
            -DCOOLPROP_EXPECTED_LINKAGE=STATIC \
            -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON >missing-eigen.log 2>&1; then
          echo "FAIL: the system package did not require Eigen3"
          exit 1
        fi
        grep -F Eigen3 missing-eigen.log

    - name: Build Debug MSVC runtimes and installed consumers
      if: runner.os == 'Windows' && matrix.linkage == 'both'
      shell: bash
      run: |
        set -euo pipefail

        python - <<'PY'
        import re
        import xml.etree.ElementTree as ET
        from pathlib import Path

        expected = {
            "CoolProp_static.vcxproj": "MultiThreadedDebugDLL",
            "CoolProp_shared.vcxproj": "MultiThreadedDebug",
        }
        namespace = {"msbuild": "http://schemas.microsoft.com/developer/msbuild/2003"}
        debug_condition = re.compile(
            r"\s*'\$\(Configuration\)\|\$\(Platform\)'\s*==\s*'Debug\|([^']+)'\s*"
        )
        for project, runtime in expected.items():
            project_path = Path("build") / project
            root = ET.parse(project_path).getroot()
            debug_groups = []
            for group in root.findall("msbuild:ItemDefinitionGroup", namespace):
                match = debug_condition.fullmatch(group.get("Condition", ""))
                if match:
                    debug_groups.append((group, match.group(1)))
            if not debug_groups:
                raise SystemExit(f"{project} has no Debug ItemDefinitionGroup")
            for group, platform in debug_groups:
                setting = group.find(
                    "msbuild:ClCompile/msbuild:RuntimeLibrary", namespace
                )
                actual = None if setting is None else setting.text
                if actual != runtime:
                    raise SystemExit(
                        f"{project} Debug|{platform} runtime is {actual!r}; "
                        f"expected {runtime!r}"
                    )
        PY

        cmake --build build --config Debug --parallel 1
        prefix="$RUNNER_TEMP/coolprop-debug-both"
        cmake -E remove_directory "$prefix"
        cmake --install build --config Debug --prefix "$prefix"
        cmake -S dev/ci/cmake-consumer -B consumer-debug \
          -DCMAKE_PREFIX_PATH="$prefix" \
          -DCOOLPROP_EXPECTED_DEFAULT_LINKAGE=SHARED
        cmake --build consumer-debug --config Debug --parallel 1
        # Run the Debug consumers, not only link them: this is the leg that
        # exercises the static (/MDd) and shared (/MTd) CoolPropd libraries at
        # runtime.  Each Debug smoke test loads the fluid library under the
        # checked-iterator CRT and takes minutes (~160-200 s locally), so run
        # the four in parallel.  The timeout turns a Debug-CRT assertion dialog,
        # which would otherwise block until the job limit, into a failure.
        ctest --test-dir consumer-debug -C Debug --output-on-failure -j 4 --timeout 1800

    - name: Test add_subdirectory consumer
      if: runner.os == 'Linux' && matrix.linkage == 'static'
      shell: bash
      run: |
        set -euo pipefail
        cmake -S dev/ci/cmake-consumer -B source-consumer \
          -DCOOLPROP_SOURCE_DIR="$GITHUB_WORKSPACE" \
          -DCOOLPROP_EXPECTED_LINKAGE=STATIC
        cmake --build source-consumer --config "${{ env.BUILD_TYPE }}"
        ctest --test-dir source-consumer -C "${{ env.BUILD_TYPE }}" --output-on-failure

    - name: Configure add_subdirectory consumer with CMP0091-old parent
      if: runner.os == 'Windows' && matrix.linkage == 'static'
      shell: bash
      run: |
        set -euo pipefail
        cmake -S dev/ci/cmake-consumer -B source-consumer-windows \
          -DCOOLPROP_SOURCE_DIR="$GITHUB_WORKSPACE" \
          -DCOOLPROP_EXPECTED_LINKAGE=STATIC

    # Create a special case for Windows since we also need 2 flavours of 32bit binaries
    - name: Configure CMake for 32bit Windows stdcall
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      run: |-
        cmake -B build_stdc  -S . -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} -DCOOLPROP_SHARED_LIBRARY:BOOL=ON -DCOOLPROP_STDCALL_LIBRARY:BOOL=ON -A Win32


    - name: Build with CMake for 32bit Windows stdcall
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      shell: bash
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build_stdc --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    - name: Test 32bit Windows stdcall package
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      shell: bash
      run: |
        set -euo pipefail
        prefix="$RUNNER_TEMP/coolprop-stdcall"
        cmake -E remove_directory "$prefix"
        cmake --install build_stdc --config "${{ env.BUILD_TYPE }}" --prefix "$prefix"
        cmake -S dev/ci/cmake-consumer -B consumer-stdcall -A Win32 \
          -DCMAKE_PREFIX_PATH="$prefix" \
          -DCOOLPROP_EXPECTED_LINKAGE=SHARED \
          -DCOOLPROP_C_ONLY=ON
        cmake --build consumer-stdcall --config "${{ env.BUILD_TYPE }}"
        ctest --test-dir consumer-stdcall -C "${{ env.BUILD_TYPE }}" --output-on-failure

    - name: Configure CMake for 32bit Windows cdecl
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      run: |-
        cmake -B build_cdecl -S . -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} -DCOOLPROP_SHARED_LIBRARY:BOOL=ON -DCOOLPROP_CDECL_LIBRARY:BOOL=ON   -A Win32


    - name: Build with CMake for 32bit Windows cdecl
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      shell: bash
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build_cdecl --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    - name: Test 32bit Windows cdecl package
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      shell: bash
      run: |
        set -euo pipefail
        prefix="$RUNNER_TEMP/coolprop-cdecl"
        cmake -E remove_directory "$prefix"
        cmake --install build_cdecl --config "${{ env.BUILD_TYPE }}" --prefix "$prefix"
        cmake -S dev/ci/cmake-consumer -B consumer-cdecl -A Win32 \
          -DCMAKE_PREFIX_PATH="$prefix" \
          -DCOOLPROP_EXPECTED_LINKAGE=SHARED \
          -DCOOLPROP_C_ONLY=ON
        cmake --build consumer-cdecl --config "${{ env.BUILD_TYPE }}"
        ctest --test-dir consumer-cdecl -C "${{ env.BUILD_TYPE }}" --output-on-failure

    - name: Configure CMake for 64bit Windows arm64
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      run: |-
        cmake -B build_arm64 -S . -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} -DCOOLPROP_SHARED_LIBRARY:BOOL=ON -A ARM64


    - name: Build with CMake for 64bit Windows arm64
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      shell: bash
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build_arm64 --target install -j "$JOBS" --config ${{ env.BUILD_TYPE }}

    - name: Link CMake consumer for Windows arm64
      if: startsWith(matrix.os, 'windows') && matrix.linkage == 'shared'
      shell: bash
      run: |
        set -euo pipefail
        prefix="$RUNNER_TEMP/coolprop-arm64"
        cmake -E remove_directory "$prefix"
        cmake --install build_arm64 --config "${{ env.BUILD_TYPE }}" --prefix "$prefix"
        cmake -S dev/ci/cmake-consumer -B consumer-arm64 -A ARM64 \
          -DCMAKE_PREFIX_PATH="$prefix" \
          -DCOOLPROP_EXPECTED_LINKAGE=SHARED \
          -DCOOLPROP_C_ONLY=ON
        cmake --build consumer-arm64 --config "${{ env.BUILD_TYPE }}"


    # - name: Tar.gz the shared library to maintain case sensitivy and file permissions
    #   working-directory: ./install_root/shared_library/
    #   shell: bash
    #   run: |
    #     set -x
    #     tar -cvzf CoolProp-${{ env.COOLPROP_VERSION }}-shared-${{ matrix.os }}.tar.gz ./*

    - name: Archive artifacts
      if: matrix.linkage == 'shared'
      uses: actions/upload-artifact@v7
      with:
          # Upload to unique artifact names tagged with suffix of matrix.os
          # This is now required by upload-artifact@v4, but will be merged later
        name: shared_library-${{ matrix.os }}
        path: install_root/shared_library

    # - name: Upload TGZ or ZIP to release
    #   if: contains(github.ref, 'refs/tags')
    #   uses: svenstaro/upload-release-action@v2
    #   with:
    #     repo_token: ${{ secrets.GITHUB_TOKEN }}
    #     file: install_root/shared_library/CoolProp-${{ env.COOLPROP_VERSION }}-shared-${{ matrix.os }}.tar.gz
    #     tag: ${{ github.ref }}
    #     overwrite: true
    #     file_glob: false

    needs:
    - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  merge:
    runs-on: ubuntu-latest
    needs:
    - build
    - alpha_bridge_inputs
    steps:
    - name: Merge Artifacts
      uses: actions/upload-artifact/merge@v7
      with:
        # Merge all existing artifacts built above that start with pattern "shared_library-*"
        pattern: shared_library-*
        # Merge to single "shared_library" artifact
        name: shared_library
        # Remove the old individual artifacts once merged
        delete-merged: true

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name 
          == 'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
          github.sha }}
        AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && 'refs/heads/master' || github.ref }}
        AB_WORKFLOW_DIGEST: 
          cd55e3aa8f36e10d462e95d6228afc8bcd9e02d5a5415594ee388c1994b11096
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
        AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
        re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
        CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES =
        (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
        \    \"\"\"GitHub prefixes callable job names with each caller's display name.\"\
        \"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in INPUT_CHECK_NAMES\n\
        \n\ndef input_identity(job):\n    for step in job.get(\"steps\", []):\n  \
        \      if step.get(\"conclusion\") != \"success\":\n            continue\n\
        \        name = step.get(\"name\", \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n\
        \            if name.startswith(prefix):\n                identity = name.removeprefix(prefix)\n\
        \                if re.fullmatch(r\"[0-9a-f]{64}\", identity):\n         \
        \           return identity\n    return \"\"\n\n\ndef parent_has_work(get,
        repository, parent):\n    if (\n        not parent\n        or parent.get(\"\
        head_branch\") != \"alpha-bridge-ci\"\n        or parent.get(\"status\") !=
        \"completed\"\n    ):\n        return True\n    sha = parent[\"head_sha\"\
        ]\n    if re.fullmatch(r\"[0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"\
        parent workflow has no exact configuration commit\")\n    record = get(f\"\
        /repos/{repository}\")\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
        )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n \
        \   if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
        schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
        ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
        ValueError(\"parent CI configuration has no verified fork ownership\")\n \
        \   path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
        .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
        ):\n        raise ValueError(\"parent workflow path is outside its configuration
        owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
        safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
        content\"])).hexdigest() != marker.get(\n        \"definition_sha256\", {}\n\
        \    ).get(path):\n        raise ValueError(\"parent workflow differs from
        its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
        :\n        return False\n    jobs = []\n    page = 1\n    while True:\n  \
        \      values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
        \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
        < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
        \        for job in jobs\n        if is_input_check(job) and job.get(\"conclusion\"\
        ) == \"success\" and input_identity(job)\n    ]\n    return not guards or
        any(\n        job not in guards and job.get(\"conclusion\") != \"skipped\"\
        \ for job in jobs\n    )\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    page = 1\n    while True:\n       \
        \ # Filter locally: GitHub caps filtered searches at 1,000 results.\n    \
        \    query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
        \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
        ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
        ) != current[\"head_branch\"] or run.get(\"event\") != event:\n          \
        \      continue\n            job_page = 1\n            while True:\n     \
        \           jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
        \n                )[\"jobs\"]\n                for job in jobs:\n        \
        \            if (\n                        (\n                           \
        \ is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
        \                            else job[\"name\"] == job_name\n            \
        \            )\n                        and job.get(\"status\") == \"completed\"\
        \n                        and job.get(\"conclusion\") == \"success\"\n   \
        \                     and input_identity(job) == identity\n              \
        \      ):\n                        return False\n                if len(jobs)
        < 100:\n                    break\n                job_page += 1\n       \
        \ if len(runs[\"workflow_runs\"]) < 100:\n            return True\n      \
        \  page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"]\n    event_payload
        = None\n    if event not in {\"schedule\", \"workflow_run\"}:\n        with
        open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\") as payload_file:\n\
        \            event_payload = json.load(payload_file)\n    inputs = {\n   \
        \     \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n        \"source_ref\"\
        : os.environ[\"AB_REF\"],\n        \"workflow_definition\": os.environ[\"\
        AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n        \"event_payload\"\
        : event_payload,\n        \"schedule\": os.environ[\"AB_SCHEDULE\"],\n   \
        \     \"variables\": json.loads(os.environ[\"AB_VARIABLES\"]),\n        \"\
        inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"runner_image\"\
        : [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\", \"\"\
        )],\n        \"producer\": json.loads(os.environ.get(\"AB_WORKFLOW_RUN\",
        \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    manual = event == \"workflow_dispatch\"\
        \ or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n    should_run = manual
        or (\n        (\n            inputs[\"event\"] != \"workflow_run\"\n     \
        \       or parent_has_work(get, os.environ[\"AB_REPOSITORY\"], inputs[\"producer\"\
        ])\n        )\n        and changed(\n            get,\n            repository=os.environ[\"\
        AB_REPOSITORY\"],\n            run_id=int(os.environ[\"AB_RUN_ID\"]),\n  \
        \          identity=identity,\n            job_name=\"CI input check\",\n\
        \        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"\
        utf-8\") as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\n        \"Explicit CI run requested\"\n        if manual\n\
        \        else \"CI inputs changed\"\n        if should_run\n        else \"\
        CI inputs unchanged; build and test jobs skipped\"\n    )\n\n\nif __name__
        == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
    - name: CI input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
