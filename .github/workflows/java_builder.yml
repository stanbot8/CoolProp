name: Java Wrapper

on:
  push:
    branches: ['master', 'main', 'develop']
    tags: ['v*']
  pull_request:
    branches: ['master', 'main', 'develop']

concurrency:
  group: ${{ github.workflow }}-${{ ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' || 
    github.run_attempt > 1) && (((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/master' && ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/main' && ((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref) 
    != 'refs/heads/develop' && !startsWith(((github.event_name == 'schedule' || 
    github.event_name == 'workflow_run') && 'refs/heads/master' || github.ref), 
    'refs/tags/')) }}

# Default the GITHUB_TOKEN to read-only; jobs that need more opt in explicitly.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sysname: Linux
          - os: windows-latest
            sysname: Windows
          - os: macos-latest
            sysname: Darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

          ref: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
            github.sha }}
      - name: Setup Java JDK
        uses: actions/setup-java@v6.0.1
        with:
          # The Java version to set up. Takes a whole or semver Java version. See examples of supported syntax in README file
          java-version: '25'
          # Java distribution. See the list of supported distributions in README file
          distribution: 'zulu'
          # The package type (jdk, jre, jdk+fx, jre+fx)
          java-package: 'jdk'

      - name: Install SWIG + 7zip (Linux)
        if: runner.os == 'Linux'
        run: |-
          sudo apt-get update -y && sudo apt-get install -y swig p7zip-full


      - name: Install SWIG + 7zip (macOS)
        if: runner.os == 'macOS'
        run: |-
          brew install swig p7zip


      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        run: |-
          choco install swig -y --no-progress


      - name: Cache CPM packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cpm_cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: |-
          cmake -B build -S . -DCOOLPROP_JAVA_MODULE=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCOOLPROP_SWIG_OPTIONS="-package org.coolprop"


      - name: Build and install
        shell: bash
        # Bound parallelism to the core count.  A bare `-j` lets make spawn an
        # unlimited number of concurrent compiles (~60+ for the CoolProp lib),
        # which exhausts RAM on the 16 GB ubuntu runner and gets the runner
        # OOM-killed ("runner received a shutdown signal", exit 143).  Matches
        # every other wrapper workflow (library_shared, javascript, mathcad...).
        # `nproc` is Linux-only (and present in Git-Bash on Windows) but absent
        # on macOS, so fall back to `sysctl`, then a bounded constant.
        run: |
          JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
          cmake --build build --target install --config Release -j "$JOBS"

      - name: Run Java tests
        shell: bash
        run: |-
          ctest --test-dir build -C Release --output-on-failure -R Javatestbuild


      - name: JSON symbol-leak gate (Java native wrapper)
        # The SWIG Java module compiles the CoolProp sources (incl. the JSON
        # loaders) into CoolPropJava.{so,jnilib} — the same exposure the Octave
        # .oct carries, the wrapper where the hidden-visibility regression
        # (CoolProp-rj2i) bit. Assert the link-time export control keeps
        # nlohmann/valijson/rapidjson out of the wrapper's dynamic symbol table.
        # nm-based, so ELF/Mach-O only — the Windows PE .dll exports nothing by
        # default (opt-in .def) and is skipped.
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # The shared object keeps the platform 'lib' prefix on ELF/Mach-O
          # (PREFIX "" is Windows-only) → libCoolPropJava.{so,jnilib}. Include
          # the SONAME-versioned forms (libCoolPropJava.so.<ver>, the regular
          # file behind the symlink) so -type f still finds it if versioned.
          wrapper=$(find build install_root -type f \( -name '*CoolPropJava.so' -o -name '*CoolPropJava.so.*' -o -name '*CoolPropJava.jnilib' -o -name '*CoolPropJava.*.jnilib' \) | head -1)
          if [ -z "$wrapper" ]; then
            echo "FAIL: CoolPropJava shared object not found under build/ or install_root/" >&2
            exit 1
          fi
          echo "Gating $wrapper"
          ./dev/ci/check-json-symbols.sh "$wrapper"

      - name: Upload per-OS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Java-${{ matrix.sysname }}
          path: install_root/Java
          # upload-artifact defaults to 'warn', so a build that installed
          # nothing would upload no artifact and still pass, leaving the merge
          # job to assemble a Java tree missing that platform.
          if-no-files-found: error

    needs:
      - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  merge:
    needs:
      - build
      - alpha_bridge_inputs
    runs-on: ubuntu-latest
    # delete-artifact removes the per-OS intermediates via the Actions API.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Download per-OS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Java-*
          path: staging

      - name: Assemble unified Java tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p Java
          shopt -s nullglob
          # An unmatched glob used to leave the literal 'staging/Java-*/' as the
          # loop's single iteration, so a download that produced nothing still
          # walked the body once and "succeeded".
          dirs=(staging/Java-*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::No per-OS Java artifacts were downloaded; nothing to merge."
            exit 1
          fi
          # Example.java, the archive and the unpacked package tree are
          # identical in all three per-OS artifacts -- that is what
          # "platform-independent" means -- so take them from the first and
          # collect only the native library directories from every artifact.
          # The copies are unconditional: they were guarded with
          # '[ -f ... ] && cp -n ... || true', which turned a missing file into
          # a silent skip and is the whole reason the published artifact
          # carried no wrapper sources (CoolProp-qrn3).  Copying once also
          # avoids depending on `cp -n`, whose exit status differs between GNU
          # (0 when it skips) and BSD (1) coreutils.
          first="${dirs[0]}"
          cp "${first}Example.java" Java/
          cp "${first}platform-independent.7z" Java/
          # The unpacked package tree was never copied at all, so even with the
          # archive present the sources beside it were missing.
          cp -R "${first}platform-independent" Java/
          for d in "${dirs[@]}"; do
            find "$d" -maxdepth 1 -type d -name '*bit' -exec cp -r {} Java/ \;
          done
          ls -R Java

      - name: Verify the assembled tree is complete
        shell: bash
        # Everything above can only fail on a file it actually touches.  This
        # step asserts the SHAPE of the result instead, so a future refactor
        # that quietly stops copying something is caught here rather than by a
        # user downloading an unusable Java/ folder.
        run: |
          set -euo pipefail
          fail=0
          note() { echo "::error::$1"; fail=1; }

          [ -f Java/Example.java ] || note "Java/Example.java is missing from the merged tree."
          [ -f Java/platform-independent.7z ] || note "Java/platform-independent.7z is missing from the merged tree."

          # The wrapper classes are the whole point of the artifact: native
          # libraries with nothing to call them are useless.  Check the
          # directory first rather than letting find fail under `set -e`, so a
          # tree missing it outright still reports every other problem too.
          if [ -d Java/platform-independent ]; then
            classes=$(find Java/platform-independent -name '*.java' -type f | wc -l)
          else
            note "Java/platform-independent is missing from the merged tree."
            classes=0
          fi
          if [ "$classes" -lt 2 ]; then
            note "Java/platform-independent holds $classes .java source(s); expected the full SWIG wrapper package."
          fi

          # One native library dir per per-OS artifact that fed the merge.
          expected=$(find staging -maxdepth 1 -type d -name 'Java-*' | wc -l)
          got=$(find Java -maxdepth 1 -type d -name '*bit' | wc -l)
          if [ "$got" -ne "$expected" ]; then
            note "Merged $got native library director(ies) from $expected per-OS artifact(s)."
          fi

          libs=$(find Java -maxdepth 2 -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.jnilib' -o -name '*.dll' \) | wc -l)
          if [ "$libs" -lt "$expected" ]; then
            note "Found $libs native librar(ies) across $expected platform director(ies)."
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Merged tree as assembled:" >&2
            find Java | sort >&2
            exit 1
          fi
          echo "OK: $classes wrapper sources, the archive, and $libs native librar(ies) across $expected platform(s)."

      - name: Upload unified Java artifact

        uses: actions/upload-artifact@v7
        with:
          name: Java
          path: Java
          if-no-files-found: error

      - name: Delete intermediate per-OS artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: Java-*

    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
      - id: identity
        name: Check source, workflow, variables, and runner inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AB_REPOSITORY: ${{ github.repository }}
          AB_RUN_ID: ${{ github.run_id }}
          AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name
            == 'workflow_run') && '022b63e4f73ce25757e1d696a81ffeeba230c261' || 
            github.sha }}
          AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
            'workflow_run') && 'refs/heads/master' || github.ref }}
          AB_WORKFLOW_DIGEST: 
            ee15a3fb426116813c2102ce1e53382d53369ead1eee3d146025c3a1c42983d7
          AB_EVENT: ${{ github.event_name }}
          AB_SCHEDULE: ${{ github.event.schedule || '' }}
          AB_VARIABLES: ${{ toJSON(vars) }}
          AB_INPUTS: ${{ toJSON(inputs) }}
          AB_DEFAULT_PERMISSIONS: write
          AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        shell: bash
        run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
          embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
          annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
          re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
          CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES
          = (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
          \    \"\"\"GitHub prefixes callable job names with each caller's display
          name.\"\"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in
          INPUT_CHECK_NAMES\n\n\ndef input_identity(job):\n    for step in job.get(\"\
          steps\", []):\n        if step.get(\"conclusion\") != \"success\":\n   \
          \         continue\n        name = step.get(\"name\", \"\")\n        for
          prefix in INPUT_IDENTITY_PREFIXES:\n            if name.startswith(prefix):\n\
          \                identity = name.removeprefix(prefix)\n                if
          re.fullmatch(r\"[0-9a-f]{64}\", identity):\n                    return identity\n\
          \    return \"\"\n\n\ndef parent_has_work(get, repository, parent):\n  \
          \  if (\n        not parent\n        or parent.get(\"head_branch\") != \"\
          alpha-bridge-ci\"\n        or parent.get(\"status\") != \"completed\"\n\
          \    ):\n        return True\n    sha = parent[\"head_sha\"]\n    if re.fullmatch(r\"\
          [0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"parent workflow
          has no exact configuration commit\")\n    record = get(f\"/repos/{repository}\"\
          )\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
          )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n\
          \    if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
          schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
          ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
          ValueError(\"parent CI configuration has no verified fork ownership\")\n\
          \    path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
          .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
          ):\n        raise ValueError(\"parent workflow path is outside its configuration
          owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
          safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
          content\"])).hexdigest() != marker.get(\n        \"definition_sha256\",
          {}\n    ).get(path):\n        raise ValueError(\"parent workflow differs
          from its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
          :\n        return False\n    jobs = []\n    page = 1\n    while True:\n\
          \        values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
          \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
          < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
          \        for job in jobs\n        if is_input_check(job) and job.get(\"\
          conclusion\") == \"success\" and input_identity(job)\n    ]\n    return
          not guards or any(\n        job not in guards and job.get(\"conclusion\"\
          ) != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get, *, repository,
          run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
          )\n    event = current[\"event\"]\n    page = 1\n    while True:\n     \
          \   # Filter locally: GitHub caps filtered searches at 1,000 results.\n\
          \        query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
          \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
          )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
          ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
          ) != current[\"head_branch\"] or run.get(\"event\") != event:\n        \
          \        continue\n            job_page = 1\n            while True:\n \
          \               jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
          \n                )[\"jobs\"]\n                for job in jobs:\n      \
          \              if (\n                        (\n                       \
          \     is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
          \                            else job[\"name\"] == job_name\n          \
          \              )\n                        and job.get(\"status\") == \"\
          completed\"\n                        and job.get(\"conclusion\") == \"success\"\
          \n                        and input_identity(job) == identity\n        \
          \            ):\n                        return False\n                if
          len(jobs) < 100:\n                    break\n                job_page +=
          1\n        if len(runs[\"workflow_runs\"]) < 100:\n            return True\n\
          \        page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"\
          ]\n    event_payload = None\n    if event not in {\"schedule\", \"workflow_run\"\
          }:\n        with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
          ) as payload_file:\n            event_payload = json.load(payload_file)\n\
          \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
          \        \"source_ref\": os.environ[\"AB_REF\"],\n        \"workflow_definition\"\
          : os.environ[\"AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n     \
          \   \"event_payload\": event_payload,\n        \"schedule\": os.environ[\"\
          AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
          ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n      \
          \  \"default_workflow_permissions\": os.environ[\"AB_DEFAULT_PERMISSIONS\"\
          ],\n        \"runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"\
          ImageVersion\", \"\")],\n        \"producer\": json.loads(os.environ.get(\"\
          AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs,
          sort_keys=True).encode()).hexdigest()\n\n    def get(path):\n        request
          = urllib.request.Request(\n            \"https://api.github.com\" + path,\n\
          \            headers={\n                \"Authorization\": \"Bearer \" +
          os.environ[\"GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
          ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n         \
          \   },\n        )\n        with urllib.request.urlopen(request, timeout=60)
          as response:\n            return json.load(response)\n\n    manual = event
          == \"workflow_dispatch\" or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n\
          \    should_run = manual or (\n        (\n            inputs[\"event\"]
          != \"workflow_run\"\n            or parent_has_work(get, os.environ[\"AB_REPOSITORY\"\
          ], inputs[\"producer\"])\n        )\n        and changed(\n            get,\n\
          \            repository=os.environ[\"AB_REPOSITORY\"],\n            run_id=int(os.environ[\"\
          AB_RUN_ID\"]),\n            identity=identity,\n            job_name=\"\
          CI input check\",\n        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"\
          ], \"a\", encoding=\"utf-8\") as output:\n        output.write(f\"digest={identity}\\\
          nchanged={str(should_run).lower()}\\n\")\n    print(\n        \"Explicit
          CI run requested\"\n        if manual\n        else \"CI inputs changed\"\
          \n        if should_run\n        else \"CI inputs unchanged; build and test
          jobs skipped\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n\n\
          ALPHA_BRIDGE_CI_PY\n"
      - name: CI input identity ${{ steps.identity.outputs.digest }}
        run: echo 'Input identity recorded'
